<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Buscador de Almacén</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #222;
    }

    .header {
      background: #003A8C;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: .9;
      font-size: 16px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .voice-card {
      background: white;
      border-radius: 22px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
    }

    .voice-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .mic-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: #003A8C;
      color: white;
      cursor: pointer;
      font-size: 62px;
      transition: .2s;
      box-shadow: 0 5px 15px rgba(0,58,140,.25);
    }

    .mic-btn:hover {
      transform: scale(1.03);
    }

    .mic-btn.listening {
      background: #16a34a;
      transform: scale(1.05);
    }

    .mic-btn.processing {
      background: #ea580c;
    }

    .mic-text {
      display: block;
      font-size: 17px;
      font-weight: bold;
      margin-top: 5px;
    }

    .voice-help {
      margin-top: 18px;
      color: #666;
      font-size: 15px;
    }

    .sound-row {
      margin-top: 18px;
    }

    .sound-btn {
      border: 1px solid #d6dce5;
      background: #f7f9fc;
      color: #444;
      padding: 9px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .sound-btn:hover {
      background: #eef2f7;
    }

    .speech-info {
      display: none;
      margin-top: 20px;
      background: #f7f9fc;
      border-radius: 14px;
      padding: 15px;
      text-align: left;
    }

    .speech-label {
      color: #777;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .speech-value {
      font-size: 18px;
      margin-top: 3px;
    }

    .interpretado {
      color: #003A8C;
      font-weight: bold;
    }

    .text-toggle {
      margin-top: 18px;
      background: transparent;
      color: #003A8C;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 10px 15px;
    }

    .text-search {
      display: none;
      margin-top: 15px;
      gap: 10px;
    }

    .text-search.visible {
      display: flex;
    }

    .text-search input {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 12px;
      outline: none;
    }

    .text-search input:focus {
      border-color: #003A8C;
    }

    .search-btn {
      border: none;
      border-radius: 12px;
      background: #003A8C;
      color: white;
      padding: 15px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    /* =====================================================
       HISTORIAL
    ===================================================== */

    .historial {
      display: none;
      margin-top: 20px;
      background: white;
      padding: 18px 20px;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgba(0,0,0,.06);
    }

    .historial.visible {
      display: block;
    }

    .historial-titulo {
      font-size: 13px;
      font-weight: bold;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .historial-botones {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .historial-btn {
      border: 1px solid #d6dce5;
      background: #f7f9fc;
      color: #003A8C;
      padding: 9px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .historial-btn:hover {
      background: #e8eef7;
    }

    .historial-limpiar {
      margin-top: 13px;
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      font-size: 12px;
      padding: 0;
    }

    #estado {
      margin-top: 18px;
      text-align: center;
      font-size: 18px;
      color: #666;
      font-weight: bold;
    }

    .resultado {
      background: white;
      margin-top: 15px;
      padding: 22px;
      border-radius: 18px;
      border-left: 7px solid #003A8C;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .ubicacion {
      font-size: 48px;
      font-weight: 900;
      color: #003A8C;
    }

    .proveedor {
      font-size: 28px;
      font-weight: 900;
      margin-top: 8px;
    }

    .detalle {
      font-size: 20px;
      margin-top: 6px;
    }

    .fecha {
      font-size: 12px;
      color: #999;
      margin-top: 14px;
    }

    /* =====================================================
       RESPUESTA CONTEXTUAL
    ===================================================== */

    .respuesta-contextual {
      background: white;
      margin-top: 15px;
      padding: 24px;
      border-radius: 18px;
      border-left: 7px solid #16a34a;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .respuesta-contextual-titulo {
      color: #777;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .respuesta-contextual-valor {
      color: #003A8C;
      font-size: 30px;
      font-weight: 900;
    }

    .respuesta-contextual-detalle {
      color: #555;
      font-size: 15px;
      margin-top: 8px;
    }

    .error {
      background: white;
      margin-top: 18px;
      padding: 22px;
      border-radius: 15px;
      color: #b91c1c;
      text-align: center;
      font-weight: bold;
    }

    @media(max-width: 700px) {

      .header h1 {
        font-size: 25px;
      }

      .container {
        padding: 15px;
      }

      .mic-btn {
        width: 160px;
        height: 160px;
      }

      .text-search.visible {
        display: block;
      }

      .text-search input {
        width: 100%;
      }

      .search-btn {
        width: 100%;
        margin-top: 8px;
      }

      .respuesta-contextual-valor {
        font-size: 25px;
      }

    }

  </style>

</head>

<body>

  <div class="header">

    <h1>BUSCADOR DE UBICACIONES</h1>

    <p>
      Proveedores • Rutas • Ubicaciones
    </p>

  </div>


  <div class="container">


    <div class="voice-card">


      <div class="voice-title">
        ¿Qué necesitas encontrar?
      </div>


      <button
        id="micBtn"
        class="mic-btn"
        onclick="escuchar()"
      >

        🎤

        <span
          id="micText"
          class="mic-text"
        >
          HABLAR
        </span>

      </button>


      <div class="voice-help">
        Toca el micrófono y haz tu pregunta
      </div>


      <div class="sound-row">

        <button
          id="soundBtn"
          class="sound-btn"
          onclick="alternarSonido()"
        >
          🔊 Respuesta por voz activada
        </button>

      </div>


      <div
        id="speechInfo"
        class="speech-info"
      >

        <div class="speech-label">
          Escuché
        </div>

        <div
          id="escuchado"
          class="speech-value"
        ></div>


        <div class="speech-label">
          Interpretado
        </div>

        <div
          id="interpretado"
          class="speech-value interpretado"
        ></div>

      </div>


      <button
        class="text-toggle"
        onclick="mostrarEscritura()"
      >
        ⌨️ Buscar escribiendo
      </button>


      <div
        id="textSearch"
        class="text-search"
      >

        <input
          id="pregunta"
          type="text"
          placeholder="Escribe tu consulta..."
          autocomplete="off"
        >

        <button
          class="search-btn"
          onclick="buscarEscrito()"
        >
          🔎 Buscar
        </button>

      </div>

    </div>


    <div
      id="historial"
      class="historial"
    >

      <div class="historial-titulo">
        Búsquedas recientes
      </div>

      <div
        id="historialBotones"
        class="historial-botones"
      ></div>

      <button
        class="historial-limpiar"
        onclick="limpiarHistorial()"
      >
        Borrar historial
      </button>

    </div>


    <div id="estado"></div>

    <div id="resultados"></div>


  </div>


  <script>


    // =====================================================
    // API
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwTizMnhtFdTiui-k3kQ0K658BwcQL_zocdSlbP15Qsj8NMuZ5D2gc1uarXV2DwuOtv/exec";


    // =====================================================
    // CONFIGURACIÓN
    // =====================================================

    let sonidoActivado = true;

    let catalogo = {

      ubicaciones: [],
      rutas: [],
      proveedores: [],
      numerosProveedor: []

    };


    // =====================================================
    // CONTEXTO DE SESIÓN
    //
    // NO usamos localStorage.
    //
    // Si se recarga o cierra la página,
    // este contexto desaparece.
    // =====================================================

    let contextoActual = null;


    function guardarContexto(datos) {

      if (
        !datos ||
        !datos.encontrado ||
        !datos.resultados ||
        !datos.resultados.length
      ) {

        return;

      }


      contextoActual = {

        tipo:
          String(
            datos.tipo || ""
          ),

        valor:
          String(
            datos.valor || ""
          ),

        resultados:
          datos.resultados.map(
            function(r) {

              return {

                ubicacion:
                  String(
                    r.ubicacion || ""
                  ),

                proveedor:
                  String(
                    r.proveedor || ""
                  ),

                numeroProveedor:
                  String(
                    r.numeroProveedor || ""
                  ),

                ruta:
                  String(
                    r.ruta || ""
                  ),

                maximo:
                  String(
                    r.maximo || ""
                  ),

                fechaActualizacion:
                  String(
                    r.fechaActualizacion || ""
                  )

              };

            }
          )

      };

    }


    // =====================================================
    // HISTORIAL
    // =====================================================

    const CLAVE_HISTORIAL =
      "buscadorAlmacenHistorial";

    const MAX_HISTORIAL = 5;


    function obtenerHistorial() {

      try {

        const guardado =
          localStorage.getItem(
            CLAVE_HISTORIAL
          );


        if (!guardado) {
          return [];
        }


        const historial =
          JSON.parse(
            guardado
          );


        return Array.isArray(
          historial
        )
          ? historial
          : [];


      } catch (error) {

        return [];

      }

    }


    function guardarEnHistorial(
      datos
    ) {

      if (
        !datos ||
        !datos.encontrado ||
        !datos.tipo ||
        !datos.valor
      ) {

        return;

      }


      const nuevaBusqueda = {

        tipo:
          String(
            datos.tipo
          ),

        valor:
          String(
            datos.valor
          )

      };


      let historial =
        obtenerHistorial();


      historial =
        historial.filter(
          function(item) {

            return !(
              item.tipo ===
                nuevaBusqueda.tipo &&
              item.valor ===
                nuevaBusqueda.valor
            );

          }
        );


      historial.unshift(
        nuevaBusqueda
      );


      historial =
        historial.slice(
          0,
          MAX_HISTORIAL
        );


      try {

        localStorage.setItem(
          CLAVE_HISTORIAL,
          JSON.stringify(
            historial
          )
        );

      } catch (error) {

        console.error(
          "No fue posible guardar el historial.",
          error
        );

      }


      mostrarHistorial();

    }


    function mostrarHistorial() {

      const historial =
        obtenerHistorial();


      const zona =
        document.getElementById(
          "historial"
        );


      const botones =
        document.getElementById(
          "historialBotones"
        );


      botones.innerHTML = "";


      if (!historial.length) {

        zona.classList.remove(
          "visible"
        );

        return;

      }


      zona.classList.add(
        "visible"
      );


      historial.forEach(
        function(item) {

          const boton =
            document.createElement(
              "button"
            );


          boton.className =
            "historial-btn";


          boton.textContent =
            etiquetaHistorial(
              item
            );


          boton.addEventListener(
            "click",
            function() {

              repetirBusqueda(
                item
              );

            }
          );


          botones.appendChild(
            boton
          );

        }
      );

    }


    function etiquetaHistorial(
      item
    ) {

      if (
        item.tipo === "UBICACION"
      ) {

        return "📍 " +
          item.valor;

      }


      if (
        item.tipo === "RUTA"
      ) {

        return "🚛 " +
          item.valor;

      }


      if (
        item.tipo === "PROVEEDOR"
      ) {

        return "🏭 " +
          item.valor;

      }


      if (
        item.tipo === "NUMERO"
      ) {

        return "# " +
          item.valor;

      }


      return item.valor;

    }


    async function repetirBusqueda(
      item
    ) {

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();

      }


      document
        .getElementById(
          "speechInfo"
        )
        .style.display =
        "none";


      const consulta =
        item.tipo +
        " " +
        item.valor;


      await consultarAPI(
        consulta,
        false
      );

    }


    function limpiarHistorial() {

      try {

        localStorage.removeItem(
          CLAVE_HISTORIAL
        );

      } catch (error) {}


      mostrarHistorial();

    }


    // =====================================================
    // CATÁLOGO
    // =====================================================

    async function cargarCatalogo() {

      try {

        const respuesta =
          await fetch(
            API_URL +
            "?catalogo=1"
          );


        if (!respuesta.ok) {

          throw new Error(
            "No fue posible cargar el catálogo."
          );

        }


        const datos =
          await respuesta.json();


        if (
          datos.ok &&
          datos.catalogo
        ) {

          catalogo =
            datos.catalogo;

          console.log(
            "Catálogo cargado:",
            catalogo
          );

        }


      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    // =====================================================
    // RECONOCIMIENTO DE VOZ
    // =====================================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let reconocimiento = null;


    // =====================================================
    // SONIDO
    // =====================================================

    function alternarSonido() {

      sonidoActivado =
        !sonidoActivado;


      const boton =
        document.getElementById(
          "soundBtn"
        );


      if (sonidoActivado) {

        boton.textContent =
          "🔊 Respuesta por voz activada";

      } else {

        boton.textContent =
          "🔇 Respuesta por voz desactivada";


        if (
          "speechSynthesis" in window
        ) {

          window.speechSynthesis.cancel();

        }

      }

    }


    function hablar(
      texto
    ) {

      if (!sonidoActivado) {
        return;
      }


      if (
        !("speechSynthesis" in window)
      ) {
        return;
      }


      window.speechSynthesis.cancel();


      const mensaje =
        new SpeechSynthesisUtterance(
          texto
        );


      mensaje.lang =
        "es-MX";

      mensaje.rate = 1;
      mensaje.pitch = 1;
      mensaje.volume = 1;


      const voces =
        window.speechSynthesis
          .getVoices();


      const vozMX =
        voces.find(
          function(voz) {

            return (
              voz.lang &&
              voz.lang
                .toLowerCase()
                .startsWith(
                  "es-mx"
                )
            );

          }
        );


      const vozES =
        voces.find(
          function(voz) {

            return (
              voz.lang &&
              voz.lang
                .toLowerCase()
                .startsWith(
                  "es"
                )
            );

          }
        );


      if (vozMX) {

        mensaje.voice =
          vozMX;

      } else if (vozES) {

        mensaje.voice =
          vozES;

      }


      window.speechSynthesis.speak(
        mensaje
      );

    }


    // =====================================================
    // BÚSQUEDA ESCRITA
    // =====================================================

    function mostrarEscritura() {

      const zona =
        document.getElementById(
          "textSearch"
        );


      zona.classList.toggle(
        "visible"
      );


      if (
        zona.classList.contains(
          "visible"
        )
      ) {

        document
          .getElementById(
            "pregunta"
          )
          .focus();

      }

    }


    document
      .getElementById(
        "pregunta"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            buscarEscrito();

          }

        }
      );


    // =====================================================
    // ESCUCHAR
    // =====================================================

    function escuchar() {

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();

      }


      if (!SpeechRecognition) {

        mostrarError(
          "Este navegador no permite reconocimiento de voz. Puedes usar la búsqueda escrita."
        );

        return;

      }


      if (reconocimiento) {

        try {

          reconocimiento.abort();

        } catch (e) {}

      }


      reconocimiento =
        new SpeechRecognition();


      reconocimiento.lang =
        "es-MX";

      reconocimiento.continuous =
        false;

      reconocimiento.interimResults =
        false;

      reconocimiento.maxAlternatives =
        3;


      const boton =
        document.getElementById(
          "micBtn"
        );


      const textoBoton =
        document.getElementById(
          "micText"
        );


      reconocimiento.onstart =
        function() {

          boton.classList.add(
            "listening"
          );

          boton.classList.remove(
            "processing"
          );

          textoBoton.textContent =
            "ESCUCHANDO...";


          document
            .getElementById(
              "estado"
            )
            .textContent =
            "Habla ahora";

        };


      reconocimiento.onresult =
        function(event) {

          boton.classList.remove(
            "listening"
          );

          boton.classList.add(
            "processing"
          );

          textoBoton.textContent =
            "PROCESANDO";


          const alternativas = [];


          for (
            let i = 0;
            i < event.results[0].length;
            i++
          ) {

            alternativas.push(
              event.results[0][i]
                .transcript
                .trim()
            );

          }


          document
            .getElementById(
              "speechInfo"
            )
            .style.display =
            "block";


          document
            .getElementById(
              "escuchado"
            )
            .textContent =
            alternativas[0] || "";


          procesarAlternativas(
            alternativas
          );

        };


      reconocimiento.onerror =
        function(event) {

          restaurarMicrofono();


          let mensaje =
            "No pude escuchar correctamente. Intenta nuevamente.";


          if (
            event.error ===
            "not-allowed"
          ) {

            mensaje =
              "Necesitas permitir el acceso al micrófono.";

          }


          if (
            event.error ===
            "no-speech"
          ) {

            mensaje =
              "No detecté voz. Toca el micrófono e intenta nuevamente.";

          }


          mostrarError(
            mensaje
          );


          hablar(
            "No pude escuchar correctamente."
          );

        };


      reconocimiento.onend =
        function() {

          if (
            !boton.classList.contains(
              "processing"
            )
          ) {

            restaurarMicrofono();

          }

        };


      reconocimiento.start();

    }


    // =====================================================
    // PROCESAR ALTERNATIVAS
    // =====================================================

    async function procesarAlternativas(
      alternativas
    ) {

      // -----------------------------------------
      // PRIMERO:
      // ¿Es una pregunta sobre el contexto?
      // -----------------------------------------

      for (
        let i = 0;
        i < alternativas.length;
        i++
      ) {

        const contextual =
          detectarPreguntaContextual(
            alternativas[i]
          );


        if (contextual) {

          document
            .getElementById(
              "interpretado"
            )
            .textContent =
            "CONTEXTO: " +
            contextual;


          responderPreguntaContextual(
            contextual,
            true
          );


          restaurarMicrofono();

          return;

        }

      }


      // -----------------------------------------
      // SI NO:
      // búsqueda normal contra catálogo.
      // -----------------------------------------

      let mejor = null;


      for (
        let i = 0;
        i < alternativas.length;
        i++
      ) {

        const candidato =
          detectarContraCatalogo(
            alternativas[i]
          );


        if (candidato) {

          mejor =
            candidato;

          break;

        }

      }


      if (mejor) {

        const consulta =
          mejor.tipo +
          " " +
          mejor.valor;


        document
          .getElementById(
            "interpretado"
          )
          .textContent =
          mejor.tipo +
          ": " +
          mejor.valor;


        await consultarAPI(
          consulta,
          true
        );


        restaurarMicrofono();

        return;

      }


      const normalizado =
        normalizarVoz(
          alternativas[0] || ""
        );


      document
        .getElementById(
          "interpretado"
        )
        .textContent =
        normalizado;


      await consultarAPI(
        normalizado,
        true
      );


      restaurarMicrofono();

    }


    // =====================================================
    // DETECTAR PREGUNTA CONTEXTUAL
    // =====================================================

    function detectarPreguntaContextual(
      texto
    ) {

      if (!contextoActual) {

        return null;

      }


      const t =
        normalizarParaComparar(
          texto
        );


      // RUTA

      if (
        /\bRUTA\b/.test(t) &&
        (
          /\bQUE\b/.test(t) ||
          /\bCUAL\b/.test(t) ||
          /\bTIENE\b/.test(t) ||
          /\bES\b/.test(t)
        )
      ) {

        return "RUTA";

      }


      // MÁXIMO

      if (
        /\bMAXIMO\b/.test(t) ||
        /\bMAXIMA\b/.test(t) ||
        /\bCAPACIDAD\b/.test(t)
      ) {

        return "MAXIMO";

      }


      // NÚMERO DE PROVEEDOR

      if (
        /\bNUMERO\b/.test(t) &&
        /\bPROVEEDOR\b/.test(t)
      ) {

        return "NUMERO";

      }


      // FECHA / ACTUALIZACIÓN

      if (
        /\bACTUALIZ/.test(t) ||
        /\bFECHA\b/.test(t) ||
        /\bCUANDO\b/.test(t)
      ) {

        return "FECHA";

      }


      // UBICACIÓN

      if (
        /\bUBICACION\b/.test(t) &&
        (
          /\bQUE\b/.test(t) ||
          /\bCUAL\b/.test(t) ||
          /\bDONDE\b/.test(t) ||
          /\bESTA\b/.test(t)
        )
      ) {

        return "UBICACION";

      }


      // PROVEEDOR

      if (
        /\bPROVEEDOR\b/.test(t) &&
        (
          /\bQUE\b/.test(t) ||
          /\bCUAL\b/.test(t) ||
          /\bQUIEN\b/.test(t) ||
          /\bES\b/.test(t)
        )
      ) {

        return "PROVEEDOR";

      }


      return null;

    }


    // =====================================================
    // RESPONDER USANDO EL CONTEXTO
    // =====================================================

    function responderPreguntaContextual(
      campo,
      vieneDeVoz
    ) {

      if (
        !contextoActual ||
        !contextoActual.resultados ||
        !contextoActual.resultados.length
      ) {

        const mensaje =
          "Primero necesito una búsqueda para saber a qué te refieres.";


        mostrarRespuestaContextual(
          "Sin contexto",
          mensaje
        );


        if (vieneDeVoz) {

          hablar(
            mensaje
          );

        }


        return;

      }


      const resultados =
        contextoActual.resultados;


      let propiedad = "";
      let titulo = "";
      let nombreHablado = "";


      if (
        campo === "RUTA"
      ) {

        propiedad =
          "ruta";

        titulo =
          "Ruta";

        nombreHablado =
          "La ruta";

      }


      if (
        campo === "MAXIMO"
      ) {

        propiedad =
          "maximo";

        titulo =
          "Máximo";

        nombreHablado =
          "El máximo";

      }


      if (
        campo === "NUMERO"
      ) {

        propiedad =
          "numeroProveedor";

        titulo =
          "Número de proveedor";

        nombreHablado =
          "El número de proveedor";

      }


      if (
        campo === "FECHA"
      ) {

        propiedad =
          "fechaActualizacion";

        titulo =
          "Última actualización";

        nombreHablado =
          "La última actualización";

      }


      if (
        campo === "UBICACION"
      ) {

        propiedad =
          "ubicacion";

        titulo =
          "Ubicación";

        nombreHablado =
          "La ubicación";

      }


      if (
        campo === "PROVEEDOR"
      ) {

        propiedad =
          "proveedor";

        titulo =
          "Proveedor";

        nombreHablado =
          "El proveedor";

      }


      const valores =
        obtenerValoresUnicos(
          resultados,
          propiedad
        );


      if (!valores.length) {

        const mensaje =
          "No hay información disponible para ese dato.";


        mostrarRespuestaContextual(
          titulo,
          mensaje
        );


        if (vieneDeVoz) {

          hablar(
            mensaje
          );

        }


        return;

      }


      // -----------------------------------------
      // UNA SOLA RESPUESTA
      // -----------------------------------------

      if (
        valores.length === 1
      ) {

        const valor =
          valores[0];


        mostrarRespuestaContextual(
          titulo,
          valor
        );


        if (vieneDeVoz) {

          let valorHablado =
            valor;


          if (
            campo === "RUTA" ||
            campo === "UBICACION" ||
            campo === "PROVEEDOR" ||
            campo === "NUMERO"
          ) {

            valorHablado =
              decirCodigo(
                valor
              );

          }


          hablar(
            nombreHablado +
            " es " +
            valorHablado +
            "."
          );

        }


        return;

      }


      // -----------------------------------------
      // VARIAS RESPUESTAS
      // -----------------------------------------

      const valoresVisibles =
        valores.join(
          ", "
        );


      mostrarRespuestaContextual(
        titulo,
        valoresVisibles,
        "Hay varios valores en el resultado anterior."
      );


      if (vieneDeVoz) {

        if (
          valores.length <= 5
        ) {

          const hablados =
            valores.map(
              function(valor) {

                if (
                  campo === "RUTA" ||
                  campo === "UBICACION" ||
                  campo === "PROVEEDOR" ||
                  campo === "NUMERO"
                ) {

                  return decirCodigo(
                    valor
                  );

                }


                return valor;

              }
            );


          hablar(
            "Hay " +
            valores.length +
            " valores: " +
            hablados.join(", ") +
            "."
          );

        } else {

          hablar(
            "Hay varios resultados diferentes. Necesito que especifiques una ubicación."
          );

        }

      }

    }


    // =====================================================
    // MOSTRAR RESPUESTA CONTEXTUAL
    // =====================================================

    function mostrarRespuestaContextual(

    ) {

      const contenedor =

    // =====================================================
    // DETECTAR CONTRA CATÁLOGO
    // =====================================================

    function detectarContraCatalogo(
      texto
    ) {

      const normal =
        normalizarParaComparar(
          texto
        );


      const tieneUbicacion =
        /\bUBICACION\b/.test(
          normal
        );


      const tieneRuta =
        /\bRUTA\b/.test(
          normal
        );


      const tieneProveedor =
        /\bPROVEEDOR\b/.test(
          normal
        );


      const ubicacion =
        encontrarMejorCodigo(
          texto,
          catalogo.ubicaciones
        );


      if (
        ubicacion &&
        (
          tieneUbicacion ||
          (
            !tieneRuta &&
            !tieneProveedor
          )
        )
      ) {

        return {

          tipo: "UBICACION",
          valor: ubicacion

        };

      }


      const ruta =
        encontrarMejorCodigo(
          texto,
          catalogo.rutas
        );


      if (
        ruta &&
        (
          tieneRuta ||
          !tieneProveedor
        )
      ) {

        return {

          tipo: "RUTA",
          valor: ruta

        };

      }


      const proveedor =
        encontrarMejorCodigo(
          texto,
          catalogo.proveedores
        );


      if (proveedor) {

        return {

          tipo: "PROVEEDOR",
          valor: proveedor

        };

      }


      const numero =
        encontrarMejorCodigo(
          texto,
          catalogo.numerosProveedor
        );


      if (numero) {

        return {

          tipo: "NUMERO",
          valor: numero

        };

      }


      return null;

    }


    // =====================================================
    // ENCONTRAR MEJOR CÓDIGO
    // =====================================================

    function encontrarMejorCodigo(
      texto,
      lista
    ) {

      if (
        !lista ||
        !lista.length
      ) {

        return null;

      }


      const fraseCompacta =
        compactarVoz(
          texto
        );


      const candidatos =
        generarCandidatos(
          texto
        );


      let mejor = null;
      let mejorPuntaje = Infinity;


      for (
        let i = 0;
        i < lista.length;
        i++
      ) {

        const codigo =
          String(
            lista[i]
          )
            .toUpperCase()
            .replace(
              /[^A-Z0-9]/g,
              ""
            );


        if (!codigo) {
          continue;
        }


        if (
          fraseCompacta.includes(
            codigo
          )
        ) {

          return lista[i];

        }


        for (
          let j = 0;
          j < candidatos.length;
          j++
        ) {

          const candidato =
            candidatos[j];


          const distancia =
            distanciaLevenshtein(
              codigo,
              candidato
            );


          if (
            distancia <
            mejorPuntaje
          ) {

            mejorPuntaje =
              distancia;

            mejor =
              lista[i];

          }

        }

      }


      if (mejor) {

        const longitud =
          String(
            mejor
          )
            .replace(
              /[^A-Z0-9]/g,
              ""
            )
            .length;


        const limite =
          longitud >= 5
            ? 2
            : 1;


        if (
          mejorPuntaje <=
          limite
        ) {

          return mejor;

        }

      }


      return null;

    }


    // =====================================================
    // GENERAR CANDIDATOS
    // =====================================================

    function generarCandidatos(
      texto
    ) {

      const candidatos =
        new Set();


      const compactado =
        compactarVoz(
          texto
        );


      if (compactado) {

        candidatos.add(
          compactado
        );

      }


      const palabras =
        normalizarVoz(
          texto
        ).split(" ");


      palabras.forEach(
        function(palabra) {

          const limpia =
            palabra.replace(
              /[^A-Z0-9]/g,
              ""
            );


          if (limpia) {

            candidatos.add(
              limpia
            );

          }

        }
      );


      for (
        let inicio = 0;
        inicio < palabras.length;
        inicio++
      ) {

        let acumulado = "";


        for (
          let fin = inicio;
          fin < palabras.length &&
          fin < inicio + 6;
          fin++
        ) {

          acumulado +=
            palabras[fin]
              .replace(
                /[^A-Z0-9]/g,
                ""
              );


          if (acumulado) {

            candidatos.add(
              acumulado
            );

          }

        }

      }


      return Array.from(
        candidatos
      );

    }


    // =====================================================
    // COMPACTAR VOZ
    // =====================================================

    function compactarVoz(
      texto
    ) {

      const normal =
        normalizarVoz(
          texto
        );


      return normal
        .replace(/\bQUE\b/g, "")
        .replace(/\bHAY\b/g, "")
        .replace(/\bDONDE\b/g, "")
        .replace(/\bESTA\b/g, "")
        .replace(/\bESTAN\b/g, "")
        .replace(/\bEL\b/g, "")
        .replace(/\bLA\b/g, "")
        .replace(/\bLOS\b/g, "")
        .replace(/\bLAS\b/g, "")
        .replace(/\bEN\b/g, "")
        .replace(/\bUBICACION\b/g, "")
        .replace(/\bPROVEEDOR\b/g, "")
        .replace(/\bRUTA\b/g, "")
        .replace(/[^A-Z0-9]/g, "");

    }


    // =====================================================
    // NORMALIZAR PARA COMPARAR
    // =====================================================

    function normalizarParaComparar(
      texto
    ) {

      return quitarAcentos(
        String(texto)
      )
        .toUpperCase()
        .replace(
          /[¿?¡!,.;:]/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    // =====================================================
    // NORMALIZAR VOZ
    // =====================================================

    function normalizarVoz(
      texto
    ) {

      let t =
        normalizarParaComparar(
          texto
        );


      const letras = {

        "A": "A",

        "BE": "B",
        "B": "B",

        "CE": "C",
        "C": "C",

        "DE": "D",
        "D": "D",

        "E": "E",

        "EFE": "F",
        "F": "F",

        "GE": "G",
        "G": "G",

        "HACHE": "H",
        "H": "H",

        "I": "I",

        "JOTA": "J",
        "J": "J",

        "KA": "K",
        "K": "K",

        "ELE": "L",
        "L": "L",

        "EME": "M",
        "M": "M",

        "ENE": "N",
        "N": "N",

        "O": "O",

        "PE": "P",
        "P": "P",

        "CU": "Q",
        "Q": "Q",

        "ERRE": "R",
        "R": "R",

        "ESE": "S",
        "S": "S",

        "TE": "T",
        "T": "T",

        "U": "U",

        "UVE": "V",
        "V": "V",

        "DOBLEU": "W",

        "EQUIS": "X",
        "X": "X",

        "YE": "Y",
        "Y": "Y",

        "ZETA": "Z",
        "Z": "Z"

      };


      const numeros = {

        "CERO": "0",
        "UNO": "1",
        "UN": "1",
        "DOS": "2",
        "TRES": "3",
        "CUATRO": "4",
        "CINCO": "5",
        "SEIS": "6",
        "SIETE": "7",
        "OCHO": "8",
        "NUEVE": "9",

        "DIEZ": "10",
        "ONCE": "11",
        "DOCE": "12",
        "TRECE": "13",
        "CATORCE": "14",
        "QUINCE": "15",
        "DIECISEIS": "16",
        "DIECISIETE": "17",
        "DIECIOCHO": "18",
        "DIECINUEVE": "19",

        "VEINTE": "20",
        "VEINTIUNO": "21",
        "VEINTIDOS": "22",
        "VEINTITRES": "23",
        "VEINTICUATRO": "24",
        "VEINTICINCO": "25",
        "VEINTISEIS": "26",
        "VEINTISIETE": "27",
        "VEINTIOCHO": "28",
        "VEINTINUEVE": "29",

        "TREINTA": "30"

      };


      const palabras =
        t.split(" ");


      const convertidas = [];


      for (
        let i = 0;
        i < palabras.length;
        i++
      ) {

        const palabra =
          palabras[i];


        if (
          palabra === "DOBLE" &&
          palabras[i + 1] === "U"
        ) {

          convertidas.push(
            "W"
          );

          i++;

          continue;

        }


        if (
          numeros[palabra] !==
          undefined
        ) {

          convertidas.push(
            numeros[palabra]
          );

          continue;

        }


        if (
          letras[palabra] !==
          undefined
        ) {

          convertidas.push(
            letras[palabra]
          );

          continue;

        }


        convertidas.push(
          palabra
        );

      }


      t =
        convertidas.join(
          " "
        );


      const partes =
        t.split(
          " "
        );


      const resultado = [];

      let acumulador = "";


      function vaciar() {

        if (acumulador) {

          resultado.push(
            acumulador
          );

          acumulador = "";

        }

      }


      for (
        let i = 0;
        i < partes.length;
        i++
      ) {

        const p =
          partes[i];


        if (
          /^[A-Z]$/.test(p)
        ) {

          acumulador += p;

          continue;

        }


        if (
          /^\d{1,3}$/.test(p) &&
          acumulador
        ) {

          acumulador += p;

          vaciar();

          continue;

        }


        vaciar();


        resultado.push(
          p
        );

      }


      vaciar();


      return resultado
        .join(" ")
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    // =====================================================
    // LEVENSHTEIN
    // =====================================================

    function distanciaLevenshtein(
      a,
      b
    ) {

      a =
        String(
          a || ""
        );

      b =
        String(
          b || ""
        );


      const matriz = [];


      for (
        let i = 0;
        i <= b.length;
        i++
      ) {

        matriz[i] = [i];

      }


      for (
        let j = 0;
        j <= a.length;
        j++
      ) {

        matriz[0][j] = j;

      }


      for (
        let i = 1;
        i <= b.length;
        i++
      ) {

        for (
          let j = 1;
          j <= a.length;
          j++
        ) {

          if (
            b.charAt(i - 1) ===
            a.charAt(j - 1)
          ) {

            matriz[i][j] =
              matriz[i - 1][j - 1];

          } else {

            matriz[i][j] =
              Math.min(

                matriz[i - 1][j - 1] + 1,

                matriz[i][j - 1] + 1,

                matriz[i - 1][j] + 1

              );

          }

        }

      }


      return matriz[b.length][a.length];

    }


    // =====================================================
    // QUITAR ACENTOS
    // =====================================================

    function quitarAcentos(
      texto
    ) {

      return String(
        texto
      )
        .normalize(
          "NFD"
        )
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }


    // =====================================================
    // BUSCAR ESCRIBIENDO
    // =====================================================

    async function buscarEscrito() {

      const pregunta =
        document
          .getElementById(
            "pregunta"
          )
          .value
          .trim();


      if (!pregunta) {
        return;
      }


      document
        .getElementById(
          "speechInfo"
        )
        .style.display =
        "none";


      // También permitimos contexto
      // mediante escritura.

      const contextual =
        detectarPreguntaContextual(
          pregunta
        );


      if (contextual) {

        responderPreguntaContextual(
          contextual,
          false
        );

        return;

      }


      await consultarAPI(
        pregunta,
        false
      );

    }


    // =====================================================
    // CONSULTAR API
    // =====================================================

    async function consultarAPI(
      consulta,
      vieneDeVoz
    ) {

      const estado =
        document.getElementById(
          "estado"
        );


      const contenedor =
        document.getElementById(
          "resultados"
        );


      estado.textContent =
        "Buscando...";


      contenedor.innerHTML = "";


      try {

        const url =
          API_URL +
          "?q=" +
          encodeURIComponent(
            consulta
          );


        const respuesta =
          await fetch(
            url
          );


        if (!respuesta.ok) {

          throw new Error(
            "Error HTTP: " +
            respuesta.status
          );

        }


        const datos =
          await respuesta.json();


        estado.textContent = "";


        if (!datos.ok) {

          const mensaje =
            datos.mensaje ||
            "Ocurrió un error.";


          mostrarError(
            mensaje
          );


          if (vieneDeVoz) {

            hablar(
              "Ocurrió un error al realizar la búsqueda."
            );

          }


          return;

        }


        if (!datos.encontrado) {

          mostrarError(
            "No encontré información para esa consulta."
          );


          if (vieneDeVoz) {

            hablar(
              "No encontré información para esa consulta."
            );

          }


          return;

        }


        if (
          vieneDeVoz &&
          datos.tipo &&
          datos.valor
        ) {

          document
            .getElementById(
              "interpretado"
            )
            .textContent =
            datos.tipo +
            ": " +
            datos.valor;

        }


        mostrarResultados(
          datos
        );


        // Guardamos búsqueda permanente
        // en historial.

        guardarEnHistorial(
          datos
        );


        // Guardamos resultado temporal
        // para conversación.

        guardarContexto(
          datos
        );


        if (vieneDeVoz) {

          responderConVoz(
            datos
          );

        }


      } catch (error) {

        estado.textContent = "";


        mostrarError(
          "No fue posible consultar la base de datos."
        );


        if (vieneDeVoz) {

          hablar(
            "No fue posible consultar la base de datos."
          );

        }


        console.error(
          error
        );

      }

    }


    // =====================================================
    // RESPUESTA HABLADA DE BÚSQUEDA NORMAL
    // =====================================================

    function responderConVoz(
      datos
    ) {

      if (
        !datos.resultados ||
        !datos.resultados.length
      ) {

        return;

      }


      const resultados =
        datos.resultados;


      const tipo =
        String(
          datos.tipo || ""
        ).toUpperCase();


      const valor =
        String(
          datos.valor || ""
        );


      if (
        tipo === "UBICACION"
      ) {

        if (
          resultados.length === 1
        ) {

          const r =
            resultados[0];


          let frase =
            "En la ubicación " +
            decirCodigo(
              r.ubicacion
            ) +
            " se encuentra el proveedor " +
            decirCodigo(
              r.proveedor
            ) +
            ".";


          if (r.ruta) {

            frase +=
              " Ruta " +
              decirCodigo(
                r.ruta
              ) +
              ".";

          }


          if (r.maximo) {

            frase +=
              " Máximo " +
              r.maximo +
              ".";

          }


          hablar(
            frase
          );


          return;

        }


        const proveedores =
          resultados
            .map(
              function(r) {

                return decirCodigo(
                  r.proveedor
                );

              }
            )
            .join(
              ", "
            );


        hablar(
          "En la ubicación " +
          decirCodigo(
            valor
          ) +
          " encontré " +
          resultados.length +
          " registros. " +
          proveedores +
          "."
        );


        return;

      }


      if (
        tipo === "PROVEEDOR" ||
        tipo === "NUMERO"
      ) {

        const ubicaciones =
          obtenerUnicos(
            resultados,
            "ubicacion"
          );


        if (
          ubicaciones.length === 1
        ) {

          hablar(
            "El proveedor " +
            decirCodigo(
              resultados[0].proveedor
            ) +
            " se encuentra en la ubicación " +
            decirCodigo(
              ubicaciones[0]
            ) +
            "."
          );


          return;

        }


        if (
          ubicaciones.length <= 5
        ) {

          hablar(
            "El proveedor " +
            decirCodigo(
              resultados[0].proveedor
            ) +
            " se encuentra en " +
            ubicaciones.length +
            " ubicaciones: " +
            ubicaciones
              .map(
                decirCodigo
              )
              .join(", ") +
            "."
          );


          return;

        }


        hablar(
          "Encontré " +
          ubicaciones.length +
          " ubicaciones para el proveedor " +
          decirCodigo(
            resultados[0].proveedor
          ) +
          ". Los resultados están en pantalla."
        );


        return;

      }


      if (
        tipo === "RUTA"
      ) {

        const ubicaciones =
          obtenerUnicos(
            resultados,
            "ubicacion"
          );


        if (
          ubicaciones.length <= 5
        ) {

          hablar(
            "La ruta " +
            decirCodigo(
              valor
            ) +
            " tiene " +
            ubicaciones.length +
            " ubicaciones: " +
            ubicaciones
              .map(
                decirCodigo
              )
              .join(", ") +
            "."
          );


          return;

        }


        hablar(
          "Encontré " +
          ubicaciones.length +
          " ubicaciones para la ruta " +
          decirCodigo(
            valor
          ) +
          ". Los resultados están en pantalla."
        );


        return;

      }


      hablar(
        "Encontré " +
        resultados.length +
        " resultados. Están en pantalla."
      );

    }


    // =====================================================
    // PRONUNCIAR CÓDIGOS
    // =====================================================

    function decirCodigo(
      codigo
    ) {

      codigo =
        String(
          codigo || ""
        )
          .toUpperCase()
          .trim();


      if (!codigo) {
        return "";
      }


      if (
        /^[A-Z0-9]+$/.test(
          codigo
        )
      ) {

        return codigo
          .split("")
          .join(" ");

      }


      return codigo;

    }


    // =====================================================
    // OBTENER ÚNICOS
    // =====================================================

    function obtenerUnicos(
      resultados,
      campo
    ) {

      const valores =
        new Set();


      resultados.forEach(
        function(r) {

          const valor =
            String(
              r[campo] || ""
            ).trim();


          if (valor) {

            valores.add(
              valor
            );

          }

        }
      );


      return Array.from(
        valores
      );

    }


    function obtenerValoresUnicos(
      resultados,
      campo
    ) {

      return obtenerUnicos(
        resultados,
        campo
      );

    }


    // =====================================================
    // MOSTRAR RESULTADOS
    // =====================================================

    function mostrarResultados(
      datos
    ) {

      const contenedor =
        document.getElementById(
          "resultados"
        );


      datos.resultados.forEach(
        function(r) {

          const tarjeta =
            document.createElement(
              "div"
            );


          tarjeta.className =
            "resultado";


          agregarCampo(
            tarjeta,
            r.ubicacion,
            "ubicacion"
          );


          agregarCampo(
            tarjeta,
            r.proveedor,
            "proveedor"
          );


          agregarCampo(
            tarjeta,
            "Proveedor #" +
            r.numeroProveedor,
            "detalle"
          );


          agregarCampo(
            tarjeta,
            "🚛 Ruta: " +
            r.ruta,
            "detalle"
          );


          agregarCampo(
            tarjeta,
            "📦 Máximo: " +
            r.maximo,
            "detalle"
          );


          if (
            r.fechaActualizacion
          ) {

            agregarCampo(
              tarjeta,
              "Última actualización: " +
              r.fechaActualizacion,
              "fecha"
            );

          }


          contenedor.appendChild(
            tarjeta
          );

        }
      );

    }


    function agregarCampo(
      padre,
      texto,
      clase
    ) {

      const elemento =
        document.createElement(
          "div"
        );


      elemento.className =
        clase;


      elemento.textContent =
        texto || "";


      padre.appendChild(
        elemento
      );

    }


    // =====================================================
    // ERROR
    // =====================================================

    function mostrarError(
      mensaje
    ) {

      const contenedor =
        document.getElementById(
          "resultados"
        );


      contenedor.innerHTML = "";


      const error =
        document.createElement(
          "div"
        );


      error.className =
        "error";


      error.textContent =
        mensaje;


      contenedor.appendChild(
        error
      );

    }


    // =====================================================
    // RESTAURAR MICRÓFONO
    // =====================================================

    function restaurarMicrofono() {

      const boton =
        document.getElementById(
          "micBtn"
        );


      boton.classList.remove(
        "listening"
      );


      boton.classList.remove(
        "processing"
      );


      document
        .getElementById(
          "micText"
        )
        .textContent =
        "HABLAR";


      document
        .getElementById(
          "estado"
        )
        .textContent =
        "";

    }


    // =====================================================
    // INICIALIZACIÓN
    // =====================================================

    cargarCatalogo();

    mostrarHistorial();


  </script>
