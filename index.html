<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Buscador de Almacén</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #222;
    }

    .header {
      background: #003A8C;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: .9;
      font-size: 16px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    /* =========================================
       PANEL DE VOZ
    ========================================= */

    .voice-card {
      background: white;
      border-radius: 22px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.10);
    }

    .voice-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .mic-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: #003A8C;
      color: white;
      cursor: pointer;
      font-size: 62px;
      transition: .2s;
      box-shadow: 0 5px 15px rgba(0,58,140,.25);
    }

    .mic-btn:hover {
      transform: scale(1.03);
    }

    .mic-btn.listening {
      background: #16a34a;
      transform: scale(1.05);
    }

    .mic-btn.processing {
      background: #ea580c;
    }

    .mic-text {
      display: block;
      font-size: 17px;
      font-weight: bold;
      margin-top: 5px;
    }

    .voice-help {
      margin-top: 18px;
      color: #666;
      font-size: 15px;
    }

    /* =========================================
       INFORMACIÓN DE VOZ
    ========================================= */

    .speech-info {
      display: none;
      margin-top: 20px;
      background: #f7f9fc;
      border-radius: 14px;
      padding: 15px;
      text-align: left;
    }

    .speech-label {
      color: #777;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .speech-value {
      font-size: 18px;
      margin-top: 3px;
    }

    .interpretado {
      color: #003A8C;
      font-weight: bold;
    }

    /* =========================================
       BÚSQUEDA ESCRITA
    ========================================= */

    .text-toggle {
      margin-top: 18px;
      background: transparent;
      color: #003A8C;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      padding: 10px 15px;
    }

    .text-search {
      display: none;
      margin-top: 15px;
      gap: 10px;
    }

    .text-search.visible {
      display: flex;
    }

    .text-search input {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 12px;
      outline: none;
    }

    .text-search input:focus {
      border-color: #003A8C;
    }

    .search-btn {
      border: none;
      border-radius: 12px;
      background: #003A8C;
      color: white;
      padding: 15px 24px;
      font-size: 18px;
      cursor: pointer;
    }

    /* =========================================
       ESTADO
    ========================================= */

    #estado {
      margin-top: 18px;
      text-align: center;
      font-size: 18px;
      color: #666;
      font-weight: bold;
    }

    /* =========================================
       RESULTADOS
    ========================================= */

    .resultado {
      background: white;
      margin-top: 15px;
      padding: 22px;
      border-radius: 18px;
      border-left: 7px solid #003A8C;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .ubicacion {
      font-size: 48px;
      font-weight: 900;
      color: #003A8C;
    }

    .proveedor {
      font-size: 28px;
      font-weight: 900;
      margin-top: 8px;
    }

    .detalle {
      font-size: 20px;
      margin-top: 6px;
    }

    .fecha {
      font-size: 12px;
      color: #999;
      margin-top: 14px;
    }

    .error {
      background: white;
      margin-top: 18px;
      padding: 22px;
      border-radius: 15px;
      color: #b91c1c;
      text-align: center;
      font-weight: bold;
    }

    @media(max-width: 700px) {

      .header h1 {
        font-size: 25px;
      }

      .container {
        padding: 15px;
      }

      .mic-btn {
        width: 160px;
        height: 160px;
      }

      .text-search.visible {
        display: block;
      }

      .text-search input {
        width: 100%;
      }

      .search-btn {
        width: 100%;
        margin-top: 8px;
      }

    }

  </style>

</head>

<body>

  <div class="header">

    <h1>BUSCADOR DE UBICACIONES</h1>

    <p>
      Proveedores • Rutas • Ubicaciones
    </p>

  </div>


  <div class="container">


    <div class="voice-card">

      <div class="voice-title">
        ¿Qué necesitas encontrar?
      </div>


      <button
        id="micBtn"
        class="mic-btn"
        onclick="escuchar()"
      >
        🎤

        <span
          id="micText"
          class="mic-text"
        >
          HABLAR
        </span>

      </button>


      <div class="voice-help">
        Toca el micrófono y haz tu pregunta
      </div>


      <div
        id="speechInfo"
        class="speech-info"
      >

        <div class="speech-label">
          Escuché
        </div>

        <div
          id="escuchado"
          class="speech-value"
        ></div>


        <div class="speech-label">
          Interpretado
        </div>

        <div
          id="interpretado"
          class="speech-value interpretado"
        ></div>

      </div>


      <button
        class="text-toggle"
        onclick="mostrarEscritura()"
      >
        ⌨️ Buscar escribiendo
      </button>


      <div
        id="textSearch"
        class="text-search"
      >

        <input
          id="pregunta"
          type="text"
          placeholder="Escribe tu consulta..."
          autocomplete="off"
        >

        <button
          class="search-btn"
          onclick="buscarEscrito()"
        >
          🔎 Buscar
        </button>

      </div>

    </div>


    <div id="estado"></div>

    <div id="resultados"></div>

  </div>


  <script>


    // =====================================================
    // API
    // =====================================================

    const API_URL =
      "https://script.google.com/macros/s/AKfycbwTizMnhtFdTiui-k3kQ0K658BwcQL_zocdSlbP15Qsj8NMuZ5D2gc1uarXV2DwuOtv/exec";


    // =====================================================
    // CATÁLOGO
    // =====================================================

    let catalogo = {

      ubicaciones: [],
      rutas: [],
      proveedores: [],
      numerosProveedor: []

    };


    // =====================================================
    // CARGAR CATÁLOGO AL ABRIR LA WEB
    // =====================================================

    async function cargarCatalogo() {

      try {

        const respuesta =
          await fetch(
            API_URL + "?catalogo=1"
          );


        if (!respuesta.ok) {

          throw new Error(
            "No fue posible cargar catálogo"
          );

        }


        const datos =
          await respuesta.json();


        if (
          datos.ok &&
          datos.catalogo
        ) {

          catalogo =
            datos.catalogo;

          console.log(
            "Catálogo cargado:",
            catalogo
          );

        }


      } catch (error) {

        console.error(
          "Error cargando catálogo:",
          error
        );

      }

    }


    cargarCatalogo();


    // =====================================================
    // RECONOCIMIENTO DE VOZ
    // =====================================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let reconocimiento = null;


    // =====================================================
    // BÚSQUEDA ESCRITA SECUNDARIA
    // =====================================================

    function mostrarEscritura() {

      const zona =
        document.getElementById(
          "textSearch"
        );


      zona.classList.toggle(
        "visible"
      );


      if (
        zona.classList.contains(
          "visible"
        )
      ) {

        document
          .getElementById("pregunta")
          .focus();

      }

    }


    document
      .getElementById("pregunta")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            buscarEscrito();

          }

        }
      );


    // =====================================================
    // ACTIVAR MICRÓFONO
    // =====================================================

    function escuchar() {


      if (!SpeechRecognition) {

        mostrarError(
          "Este navegador no permite reconocimiento de voz. Puedes usar la búsqueda escrita."
        );

        return;

      }


      if (reconocimiento) {

        try {

          reconocimiento.abort();

        } catch (e) {}

      }


      reconocimiento =
        new SpeechRecognition();


      reconocimiento.lang =
        "es-MX";


      reconocimiento.continuous =
        false;


      reconocimiento.interimResults =
        false;


      // Pedimos hasta 3 interpretaciones
      // al motor de reconocimiento.

      reconocimiento.maxAlternatives =
        3;


      const boton =
        document.getElementById(
          "micBtn"
        );


      const textoBoton =
        document.getElementById(
          "micText"
        );


      reconocimiento.onstart =
        function() {

          boton.classList.add(
            "listening"
          );

          boton.classList.remove(
            "processing"
          );

          textoBoton.textContent =
            "ESCUCHANDO...";

          document
            .getElementById("estado")
            .textContent =
            "Habla ahora";

        };


      reconocimiento.onresult =
        function(event) {


          boton.classList.remove(
            "listening"
          );

          boton.classList.add(
            "processing"
          );


          textoBoton.textContent =
            "PROCESANDO";


          const alternativas = [];


          for (
            let i = 0;
            i < event.results[0].length;
            i++
          ) {

            alternativas.push(
              event.results[0][i]
                .transcript
                .trim()
            );

          }


          document
            .getElementById(
              "speechInfo"
            )
            .style.display =
            "block";


          document
            .getElementById(
              "escuchado"
            )
            .textContent =
            alternativas[0] || "";


          procesarAlternativas(
            alternativas
          );

        };


      reconocimiento.onerror =
        function(event) {


          restaurarMicrofono();


          let mensaje =
            "No pude escuchar correctamente. Intenta nuevamente.";


          if (
            event.error ===
            "not-allowed"
          ) {

            mensaje =
              "Necesitas permitir el acceso al micrófono.";

          }


          if (
            event.error ===
            "no-speech"
          ) {

            mensaje =
              "No detecté voz. Toca el micrófono e intenta nuevamente.";

          }


          mostrarError(
            mensaje
          );

        };


      reconocimiento.onend =
        function() {

          if (
            !boton.classList.contains(
              "processing"
            )
          ) {

            restaurarMicrofono();

          }

        };


      reconocimiento.start();

    }


    // =====================================================
    // PROCESAR LAS ALTERNATIVAS DEL MICRÓFONO
    // =====================================================

    async function procesarAlternativas(
      alternativas
    ) {


      let mejor = null;


      // Probar cada interpretación
      // entregada por el navegador.

      for (
        let i = 0;
        i < alternativas.length;
        i++
      ) {


        const texto =
          alternativas[i];


        const candidato =
          detectarContraCatalogo(
            texto
          );


        if (candidato) {

          mejor = candidato;

          break;

        }

      }


      // Si encontramos algo que existe
      // realmente en la base de datos.

      if (mejor) {


        const consulta =
          mejor.tipo +
          " " +
          mejor.valor;


        document
          .getElementById(
            "interpretado"
          )
          .textContent =
          mejor.tipo +
          ": " +
          mejor.valor;


        await consultarAPI(
          consulta
        );


        restaurarMicrofono();

        return;

      }


      // Si el catálogo no pudo resolverlo,
      // usamos el normalizador tradicional.

      const normalizado =
        normalizarVoz(
          alternativas[0] || ""
        );


      document
        .getElementById(
          "interpretado"
        )
        .textContent =
        normalizado;


      await consultarAPI(
        normalizado
      );


      restaurarMicrofono();

    }


    // =====================================================
    // DETECTAR CONTRA LOS DATOS REALES
    // =====================================================

    function detectarContraCatalogo(
      texto
    ) {


      const normal =
        normalizarParaComparar(
          texto
        );


      // -----------------------------------------
      // Primero buscamos contexto explícito.
      // -----------------------------------------

      const tieneUbicacion =
        /\bUBICACION\b/.test(normal);


      const tieneRuta =
        /\bRUTA\b/.test(normal);


      const tieneProveedor =
        /\bPROVEEDOR\b/.test(normal);


      // -----------------------------------------
      // UBICACIONES
      // -----------------------------------------

      const ubicacion =
        encontrarMejorCodigo(
          texto,
          catalogo.ubicaciones
        );


      if (
        ubicacion &&
        (
          tieneUbicacion ||
          !tieneRuta &&
          !tieneProveedor
        )
      ) {

        return {
          tipo: "UBICACION",
          valor: ubicacion
        };

      }


      // -----------------------------------------
      // RUTAS
      // -----------------------------------------

      const ruta =
        encontrarMejorCodigo(
          texto,
          catalogo.rutas
        );


      if (
        ruta &&
        (
          tieneRuta ||
          !tieneProveedor
        )
      ) {

        return {
          tipo: "RUTA",
          valor: ruta
        };

      }


      // -----------------------------------------
      // PROVEEDORES
      // -----------------------------------------

      const proveedor =
        encontrarMejorCodigo(
          texto,
          catalogo.proveedores
        );


      if (proveedor) {

        return {
          tipo: "PROVEEDOR",
          valor: proveedor
        };

      }


      // -----------------------------------------
      // NÚMEROS DE PROVEEDOR
      // -----------------------------------------

      const numero =
        encontrarMejorCodigo(
          texto,
          catalogo.numerosProveedor
        );


      if (numero) {

        return {
          tipo: "NUMERO",
          valor: numero
        };

      }


      return null;

    }


    // =====================================================
    // BUSCAR CÓDIGO REAL DENTRO DE UNA FRASE
    // =====================================================

    function encontrarMejorCodigo(
      texto,
      lista
    ) {


      if (
        !lista ||
        !lista.length
      ) {

        return null;

      }


      const fraseCompacta =
        compactarVoz(
          texto
        );


      let mejor = null;
      let mejorPuntaje = Infinity;


      for (
        let i = 0;
        i < lista.length;
        i++
      ) {


        const codigo =
          String(lista[i])
            .toUpperCase()
            .replace(
              /[^A-Z0-9]/g,
              ""
            );


        if (!codigo) {
          continue;
        }


        // Coincidencia exacta dentro
        // de la frase compactada.

        if (
          fraseCompacta.includes(
            codigo
          )
        ) {

          return lista[i];

        }


        // Comparamos distancia entre
        // el código real y fragmentos
        // posibles de lo escuchado.

        const tokens =
          generarCandidatos(
            texto
          );


        for (
          let j = 0;
          j < tokens.length;
          j++
        ) {


          const candidato =
            tokens[j];


          const distancia =
            distanciaLevenshtein(
              codigo,
              candidato
            );


          if (
            distancia <
            mejorPuntaje
          ) {

            mejorPuntaje =
              distancia;

            mejor =
              lista[i];

          }

        }

      }


      // No queremos corregir de forma
      // demasiado agresiva.
      //
      // Código corto: máximo 1 error.
      // Código más largo: máximo 2.

      if (mejor) {

        const longitud =
          String(mejor)
            .replace(
              /[^A-Z0-9]/g,
              ""
            )
            .length;


        const limite =
          longitud >= 5
            ? 2
            : 1;


        if (
          mejorPuntaje <= limite
        ) {

          return mejor;

        }

      }


      return null;

    }


    // =====================================================
    // GENERAR POSIBLES CÓDIGOS DESDE LA VOZ
    // =====================================================

    function generarCandidatos(
      texto
    ) {


      const compactado =
        compactarVoz(
          texto
        );


      const candidatos =
        new Set();


      if (compactado) {

        candidatos.add(
          compactado
        );

      }


      const palabras =
        normalizarVoz(texto)
          .split(" ");


      palabras.forEach(
        function(palabra) {

          const limpia =
            palabra.replace(
              /[^A-Z0-9]/g,
              ""
            );


          if (limpia) {

            candidatos.add(
              limpia
            );

          }

        }
      );


      // También combinamos grupos
      // consecutivos de palabras.

      for (
        let inicio = 0;
        inicio < palabras.length;
        inicio++
      ) {

        let acumulado = "";


        for (
          let fin = inicio;
          fin < palabras.length &&
          fin < inicio + 6;
          fin++
        ) {


          acumulado +=
            palabras[fin]
              .replace(
                /[^A-Z0-9]/g,
                ""
              );


          if (acumulado) {

            candidatos.add(
              acumulado
            );

          }

        }

      }


      return Array.from(
        candidatos
      );

    }


    // =====================================================
    // COMPACTAR UNA FRASE HABLADA
    // =====================================================

    function compactarVoz(
      texto
    ) {


      const normal =
        normalizarVoz(
          texto
        );


      return normal
        .replace(
          /\bQUE\b/g,
          ""
        )
        .replace(
          /\bHAY\b/g,
          ""
        )
        .replace(
          /\bDONDE\b/g,
          ""
        )
        .replace(
          /\bESTA\b/g,
          ""
        )
        .replace(
          /\bEL\b/g,
          ""
        )
        .replace(
          /\bLA\b/g,
          ""
        )
        .replace(
          /\bLOS\b/g,
          ""
        )
        .replace(
          /\bLAS\b/g,
          ""
        )
        .replace(
          /\bEN\b/g,
          ""
        )
        .replace(
          /\bUBICACION\b/g,
          ""
        )
        .replace(
          /\bPROVEEDOR\b/g,
          ""
        )
        .replace(
          /\bRUTA\b/g,
          ""
        )
        .replace(
          /[^A-Z0-9]/g,
          ""
        );

    }


    // =====================================================
    // NORMALIZAR PARA COMPARACIÓN
    // =====================================================

    function normalizarParaComparar(
      texto
    ) {

      return quitarAcentos(
        String(texto)
      )
        .toUpperCase()
        .replace(
          /[¿?¡!,.;:]/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    // =====================================================
    // NORMALIZADOR DE VOZ
    // =====================================================

    function normalizarVoz(
      texto
    ) {


      let t =
        normalizarParaComparar(
          texto
        );


      const letras = {

        "A": "A",

        "BE": "B",
        "B": "B",

        "CE": "C",
        "C": "C",

        "DE": "D",
        "D": "D",

        "E": "E",

        "EFE": "F",
        "F": "F",

        "GE": "G",
        "G": "G",

        "HACHE": "H",
        "H": "H",

        "I": "I",

        "JOTA": "J",
        "J": "J",

        "KA": "K",
        "K": "K",

        "ELE": "L",
        "L": "L",

        "EME": "M",
        "M": "M",

        "ENE": "N",
        "N": "N",

        "O": "O",

        "PE": "P",
        "P": "P",

        "CU": "Q",
        "Q": "Q",

        "ERRE": "R",
        "R": "R",

        "ESE": "S",
        "S": "S",

        "TE": "T",
        "T": "T",

        "U": "U",

        "UVE": "V",
        "V": "V",

        "DOBLEU": "W",

        "EQUIS": "X",
        "X": "X",

        "YE": "Y",
        "Y": "Y",

        "ZETA": "Z",
        "Z": "Z"

      };


      const numeros = {

        "CERO": "0",
        "UNO": "1",
        "UN": "1",
        "DOS": "2",
        "TRES": "3",
        "CUATRO": "4",
        "CINCO": "5",
        "SEIS": "6",
        "SIETE": "7",
        "OCHO": "8",
        "NUEVE": "9",

        "DIEZ": "10",
        "ONCE": "11",
        "DOCE": "12",
        "TRECE": "13",
        "CATORCE": "14",
        "QUINCE": "15",
        "DIECISEIS": "16",
        "DIECISIETE": "17",
        "DIECIOCHO": "18",
        "DIECINUEVE": "19",

        "VEINTE": "20",
        "VEINTIUNO": "21",
        "VEINTIDOS": "22",
        "VEINTITRES": "23",
        "VEINTICUATRO": "24",
        "VEINTICINCO": "25",
        "VEINTISEIS": "26",
        "VEINTISIETE": "27",
        "VEINTIOCHO": "28",
        "VEINTINUEVE": "29",

        "TREINTA": "30"

      };


      let palabras =
        t.split(" ");


      let convertidas = [];


      for (
        let i = 0;
        i < palabras.length;
        i++
      ) {


        const palabra =
          palabras[i];


        // DOBLE U

        if (
          palabra === "DOBLE" &&
          palabras[i + 1] === "U"
        ) {

          convertidas.push(
            "W"
          );

          i++;

          continue;

        }


        if (
          numeros[palabra] !==
          undefined
        ) {

          convertidas.push(
            numeros[palabra]
          );

          continue;

        }


        if (
          letras[palabra] !==
          undefined
        ) {

          convertidas.push(
            letras[palabra]
          );

          continue;

        }


        convertidas.push(
          palabra
        );

      }


      t =
        convertidas.join(" ");


      // -----------------------------------------
      // UNIR LETRAS HABLADAS
      // -----------------------------------------

      const partes =
        t.split(" ");


      const resultado = [];

      let acumulador = "";


      function vaciar() {

        if (acumulador) {

          resultado.push(
            acumulador
          );

          acumulador = "";

        }

      }


      for (
        let i = 0;
        i < partes.length;
        i++
      ) {


        const p =
          partes[i];


        if (
          /^[A-Z]$/.test(p)
        ) {

          acumulador += p;

          continue;

        }


        if (
          /^\d{1,3}$/.test(p) &&
          acumulador
        ) {

          acumulador += p;

          vaciar();

          continue;

        }


        vaciar();

        resultado.push(
          p
        );

      }


      vaciar();


      return resultado
        .join(" ")
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }


    // =====================================================
    // DISTANCIA LEVENSHTEIN
    //
    // Sirve para encontrar códigos muy parecidos.
    //
    // SRKM   vs SRKMX
    // SRKMX  vs SRKMX
    // etc.
    // =====================================================

    function distanciaLevenshtein(
      a,
      b
    ) {


      a =
        String(a || "");


      b =
        String(b || "");


      const matriz = [];


      for (
        let i = 0;
        i <= b.length;
        i++
      ) {

        matriz[i] =
          [i];

      }


      for (
        let j = 0;
        j <= a.length;
        j++
      ) {

        matriz[0][j] =
          j;

      }


      for (
        let i = 1;
        i <= b.length;
        i++
      ) {


        for (
          let j = 1;
          j <= a.length;
          j++
        ) {


          if (
            b.charAt(i - 1) ===
            a.charAt(j - 1)
          ) {

            matriz[i][j] =
              matriz[i - 1][j - 1];

          } else {

            matriz[i][j] =
              Math.min(

                matriz[i - 1][j - 1] + 1,

                matriz[i][j - 1] + 1,

                matriz[i - 1][j] + 1

              );

          }

        }

      }


      return matriz[b.length][a.length];

    }


    // =====================================================
    // QUITAR ACENTOS
    // =====================================================

    function quitarAcentos(
      texto
    ) {

      return String(texto)
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        );

    }


    // =====================================================
    // BÚSQUEDA ESCRITA
    // =====================================================

    async function buscarEscrito() {


      const pregunta =
        document
          .getElementById(
            "pregunta"
          )
          .value
          .trim();


      if (!pregunta) {

        return;

      }


      document
        .getElementById(
          "speechInfo"
        )
        .style.display =
        "none";


      await consultarAPI(
        pregunta
      );

    }


    // =====================================================
    // CONSULTAR API
    // =====================================================

    async function consultarAPI(
      consulta
    ) {


      const estado =
        document.getElementById(
          "estado"
        );


      const contenedor =
        document.getElementById(
          "resultados"
        );


      estado.textContent =
        "Buscando...";


      contenedor.innerHTML =
        "";


      try {


        const url =
          API_URL +
          "?q=" +
          encodeURIComponent(
            consulta
          );


        const respuesta =
          await fetch(url);


        if (!respuesta.ok) {

          throw new Error(
            "Error HTTP: " +
            respuesta.status
          );

        }


        const datos =
          await respuesta.json();


        estado.textContent =
          "";


        if (!datos.ok) {

          mostrarError(
            datos.mensaje ||
            "Ocurrió un error."
          );

          return;

        }


        if (!datos.encontrado) {

          mostrarError(
            "No encontré información para esa consulta."
          );

          return;

        }


        if (
          document
            .getElementById(
              "speechInfo"
            )
            .style.display ===
            "block" &&
          datos.tipo &&
          datos.valor
        ) {

          document
            .getElementById(
              "interpretado"
            )
            .textContent =
            datos.tipo +
            ": " +
            datos.valor;

        }


        mostrarResultados(
          datos
        );


      } catch (error) {


        estado.textContent =
          "";


        mostrarError(
          "No fue posible consultar la base de datos."
        );


        console.error(
          error
        );

      }

    }


    // =====================================================
    // MOSTRAR RESULTADOS
    // =====================================================

    function mostrarResultados(
      datos
    ) {


      const contenedor =
        document.getElementById(
          "resultados"
        );


      datos.resultados.forEach(
        function(r) {


          const tarjeta =
            document.createElement(
              "div"
            );


          tarjeta.className =
            "resultado";


          agregarCampo(
            tarjeta,
            r.ubicacion,
            "ubicacion"
          );


          agregarCampo(
            tarjeta,
            r.proveedor,
            "proveedor"
          );


          agregarCampo(
            tarjeta,
            "Proveedor #" +
              r.numeroProveedor,
            "detalle"
          );


          agregarCampo(
            tarjeta,
            "🚛 Ruta: " +
              r.ruta,
            "detalle"
          );


          agregarCampo(
            tarjeta,
            "📦 Máximo: " +
              r.maximo,
            "detalle"
          );


          if (
            r.fechaActualizacion
          ) {

            agregarCampo(
              tarjeta,
              "Última actualización: " +
                r.fechaActualizacion,
              "fecha"
            );

          }


          contenedor.appendChild(
            tarjeta
          );

        }
      );

    }


    // =====================================================
    // AGREGAR CAMPO SEGURO
    // =====================================================

    function agregarCampo(
      padre,
      texto,
      clase
    ) {


      const elemento =
        document.createElement(
          "div"
        );


      elemento.className =
        clase;


      elemento.textContent =
        texto || "";


      padre.appendChild(
        elemento
      );

    }


    // =====================================================
    // ERROR
    // =====================================================

    function mostrarError(
      mensaje
    ) {


      const contenedor =
        document.getElementById(
          "resultados"
        );


      contenedor.innerHTML =
        "";


      const error =
        document.createElement(
          "div"
        );


      error.className =
        "error";


      error.textContent =
        mensaje;


      contenedor.appendChild(
        error
      );

    }


    // =====================================================
    // RESTAURAR MICRÓFONO
    // =====================================================

    function restaurarMicrofono() {


      const boton =
        document.getElementById(
          "micBtn"
        );


      boton.classList.remove(
        "listening"
      );


      boton.classList.remove(
        "processing"
      );


      document
        .getElementById(
          "micText"
        )
        .textContent =
        "HABLAR";


      document
        .getElementById(
          "estado"
        )
        .textContent =
        "";

    }


  </script>
